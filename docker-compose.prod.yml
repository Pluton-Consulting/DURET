# ============================================================
# Overlay PRODUCTION (VPS) — mode HTTP derrière le VPN (Headscale).
# Usage :  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================================
# L'application est servie en HTTPS par Caddy, qui n'ecoute que sur l'IP VPN du
# VPS (VPN_IP = `tailscale ip -4`). Le tunnel WireGuard chiffrait deja le trafic,
# mais il etait la SEULE couche : le jour ou l'app est jointe autrement — port
# ouvert, regle de pare-feu ratee — tout repassait en clair, identifiants compris.
#
# nginx reste derriere, en interne (HEADSCALE_IP=127.0.0.1) : il garde tout le
# routage (/, /api/, WebSocket, en-tetes, taille d'import), Caddy ne fait que la
# terminaison TLS. Rien du routage n'est reecrit, donc rien ne peut y regresser.
services:
  postgres:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    # Prod : pas de --reload (économise le CPU).
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  browser-worker:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  # Terminaison HTTPS. N'ECOUTE QUE sur l'IP du VPN (${VPN_IP}) : l'application
  # reste injoignable depuis Internet, le certificat est obtenu par DNS-01 (aucune
  # ouverture publique n'est necessaire pour le renouvellement).
  # nginx repasse en interne (HEADSCALE_IP=127.0.0.1) ; Caddy le joint par le
  # reseau Docker.
  caddy:
    build: ./caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "${VPN_IP}:80:80"
      - "${VPN_IP}:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    networks:
      - noa_network

volumes:
  caddy_data:
  caddy_config:
