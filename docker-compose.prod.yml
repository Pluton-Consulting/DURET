# ============================================================
# Overlay PRODUCTION (VPS) — mode HTTP derrière le VPN (Headscale).
# Usage :  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ============================================================
# L'application est servie en HTTP par nginx, lie a l'IP VPN du VPS
# (HEADSCALE_IP = `tailscale ip -4`). Le tunnel WireGuard chiffre deja tout le
# trafic : rien ne circule en clair sur Internet.
#
# HTTPS : pret mais NON ACTIVE. Tout est ecrit (caddy/, docker-compose.https.yml) ;
# il suffit d'ajouter `-f docker-compose.https.yml` a la commande et de remplir les
# variables listees dans ce fichier. Tant que le VPN reste la seule voie d'acces,
# HTTP y est defendable — mais c'est UNE SEULE couche : le jour ou l'application
# est jointe autrement, tout repasse en clair, identifiants compris.
services:
  postgres:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    # Prod : pas de --reload (économise le CPU).
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  browser-worker:
    restart: unless-stopped
  nginx:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
