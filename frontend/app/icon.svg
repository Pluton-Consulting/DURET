<!--
  Icône d'onglet. Next.js sert automatiquement `app/icon.svg` comme favicon.

  Sur fond NOIR, comme le logo d'origine : c'est ainsi que la marque est fournie,
  et un onglet de navigateur a besoin d'une tuile pleine pour se distinguer de
  ses voisines. Les traits sont épaissis (56 au lieu de 40) car à 16 pixels un
  trait fin disparaît — la fidélité au tracé ne sert à rien si le résultat est
  illisible à la taille où on le regarde.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
     fill="none" role="img" aria-label="Duret &amp; Sols">
  <rect width="1024" height="1024" rx="192" fill="#0B0E11"/>
  <g transform="translate(64, 262) scale(0.875)">
    <rect x="404" y="20"  width="598" height="598" stroke="#0687DA" stroke-width="56"/>
    <rect x="20"  y="314" width="294" height="292" stroke="#F41122" stroke-width="56"/>
    <rect x="172" y="68"  width="144" height="142" stroke="#FFE202" stroke-width="50"/>
  </g>
</svg>
