events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin always;

        # WebSocket streaming du chat. Le endpoint réel est /api/chat/ws/{thread_id}
        # (préfixe router /api/chat + @router.websocket("/ws/...")). L'ancien /api/ws/
        # ne matchait PAS ce chemin → le WS retombait dans `location /api/` (sans les
        # en-têtes Upgrade) → handshake échoué → repli POST bloquant → 504, et le
        # chemin de réflexion figé. On matche donc le bon préfixe avec l'upgrade.
        location /api/chat/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── /api/auth/* : collision backend (FastAPI) vs NextAuth (frontend) ──
        # NextAuth gère la SESSION sous /api/auth/* côté frontend (session, csrf,
        # callback, signin/out…). Le backend n'expose QUE magic-link + logout sous
        # /api/auth/. On route donc ces deux-là vers le backend, et TOUT LE RESTE
        # de /api/auth/ vers le frontend (sinon la connexion NextAuth échoue).
        location /api/auth/magic-link/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location = /api/auth/logout {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/auth/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reste de l'API (chat, users, dashboard, browser, skills…) → backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;   # le POST /api/chat/ (repli sans WS) peut être long (cascade LLM)
        }

        # Pages Next.js → frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
