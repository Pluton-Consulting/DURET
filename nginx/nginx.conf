events {
    worker_connections 1024;
}

http {
    # DERRIÈRE CADDY, `$scheme` MENT.
    #
    # nginx écoute en clair sur le réseau interne de Docker : `$scheme` y vaut
    # toujours « http », y compris quand la personne est arrivée en HTTPS. Le
    # transmettre tel quel annoncerait « http » au frontend et au backend, qui
    # fabriqueraient alors des URL absolues en clair : une redirection de
    # NextAuth vers http://…, sur un port où plus rien n'écoute une fois Caddy
    # en place, et une connexion qui échoue sans que rien n'explique pourquoi.
    #
    # On relaie donc ce que Caddy a réellement constaté, en retombant sur
    # `$scheme` quand l'en-tête est absent : le montage sans TLS, en
    # développement ou avant bascule, continue de fonctionner à l'identique.
    map $http_x_forwarded_proto $proto_client {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    # NGINX RESOUT LES CONTENEURS A CHAQUE REQUETE, PLUS UNE FOIS POUR TOUTES.
    #
    # Un bloc `upstream` resout son nom AU DEMARRAGE de nginx, puis garde
    # l'adresse indefiniment. Or un `docker compose up -d --build backend`
    # recree le conteneur, qui recoit une NOUVELLE adresse sur le reseau
    # interne : nginx continue de parler a l'ancienne, qui n'existe plus, et
    # rend 502 sur TOUTES les routes de l'API.
    #
    # Releve en production le 18/08 : backend recree depuis dix minutes, nginx
    # debout depuis dix-sept heures, et plus personne ne pouvait se connecter.
    # Le symptome ne designe pas sa cause — le backend allait parfaitement bien,
    # ses journaux ne montraient rien, et c'est l'ECART D'AGE entre les deux
    # conteneurs qui a trahi le probleme.
    #
    # 127.0.0.11 est le resolveur interne de Docker, present sur tout reseau
    # defini par l'utilisateur. Ecrire la cible dans une VARIABLE force nginx a
    # la resoudre a chaque requete, avec le cache court fixe ci-dessous.
    #
    # Ce qu'on perd : la repartition de charge et les connexions persistantes du
    # bloc `upstream`. Il n'y a qu'un conteneur par service ici, et aucun
    # `keepalive` n'etait configure : rien de reel n'est sacrifie.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # Cibles resolues a chaque requete (cf. resolver ci-dessus).
        set $cible_backend  backend:8000;
        set $cible_frontend frontend:3000;

        # Taille maximale d'un import. SANS cette directive, nginx applique son
        # defaut de 1 Mo et renvoie 413 AVANT le backend : la limite de 10 Mo
        # cote applicatif etait donc inatteignable, et un export de base un peu
        # fourni echouait sans que le message d'erreur ne dise pourquoi.
        # Doit rester alignee sur `max_body_mb` (config.py).
        client_max_body_size 10m;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin always;

        # WebSocket streaming du chat. Le endpoint réel est /api/chat/ws/{thread_id}
        # (préfixe router /api/chat + @router.websocket("/ws/...")). L'ancien /api/ws/
        # ne matchait PAS ce chemin → le WS retombait dans `location /api/` (sans les
        # en-têtes Upgrade) → handshake échoué → repli POST bloquant → 504, et le
        # chemin de réflexion figé. On matche donc le bon préfixe avec l'upgrade.
        location /api/chat/ws/ {
            proxy_pass http://$cible_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── /api/auth/* : collision backend (FastAPI) vs NextAuth (frontend) ──
        # NextAuth gère la SESSION sous /api/auth/* côté frontend (session, csrf,
        # callback, signin/out…). Le backend n'expose QUE magic-link + logout sous
        # /api/auth/. On route donc ces deux-là vers le backend, et TOUT LE RESTE
        # de /api/auth/ vers le frontend (sinon la connexion NextAuth échoue).
        location /api/auth/magic-link/ {
            proxy_pass http://$cible_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_client;
        }
        location = /api/auth/logout {
            proxy_pass http://$cible_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_client;
        }
        location /api/auth/ {
            proxy_pass http://$cible_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_client;
        }

        # Repli du chat quand le WebSocket ne s'établit pas. Un tour peut
        # enchaîner plusieurs dizaines d'actions avant de rédiger : 300 s le
        # coupaient en plein travail, et l'utilisateur perdait un tour déjà
        # payé. Le WebSocket ci-dessus patiente une heure, ce chemin-ci n'a
        # aucune raison d'être moins patient — c'est le MÊME tour.
        #
        # Bloc séparé pour que cette patience ne s'étende pas au reste de
        # l'API : nginx retient le préfixe le plus long, /api/chat/ l'emporte
        # donc sur /api/ sans que l'ordre d'écriture compte.
        location /api/chat/ {
            proxy_pass http://$cible_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_client;
            proxy_read_timeout 3600s;
        }

        # Reste de l'API (users, dashboard, browser, skills…) → backend
        location /api/ {
            proxy_pass http://$cible_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_client;
            proxy_read_timeout 300s;   # le POST /api/chat/ (repli sans WS) peut être long (cascade LLM)
        }

        # Pages Next.js → frontend
        location / {
            proxy_pass http://$cible_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proto_client;

            # CE BLOC N'AVAIT AUCUN DÉLAI, donc celui par défaut : 60 secondes.
            # Or les pages Next.js interrogent le backend CÔTÉ SERVEUR pendant
            # leur rendu (`/parametres` charge la liste des utilisateurs). Le
            # jour où le backend a été gelé par une ingestion, la réponse est
            # partie en chunked puis s'est tue : nginx a coupé au bout d'une
            # minute, le navigateur a reçu un arbre HTML TRONQUÉ, et React a
            # rendu trois erreurs d'hydratation d'affilée avant de tomber sur
            # « Application error ». L'utilisateur a vu un front cassé pour une
            # panne qui n'était pas la sienne.
            #
            # 300 s, comme `/api/` : la cause d'une lenteur est presque toujours
            # le backend, autant que les deux chemins aient la même patience.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Le streaming RSC de Next.js part en morceaux. Tamponné, il arrive
            # d'un bloc — et une coupure en cours de route livre un document
            # incomplet au lieu de rien, ce qui est pire : le navigateur essaie
            # de l'afficher.
            proxy_buffering off;
        }
    }
}
